:root{--ink:#3A2A1E;--ink2:#5E4A3B;--paper:#FFFDF7;--cream:#FFF8EA;--sand:#F6E7C8;--yellow:#FFD84A;
  --water:#4F9BD9;--wl:#D6ECFB;--forest:#4E9A4A;--fl:#DDF0D2;--mineral:#7F8794;--ml:#E7E9EE;--red:#C2411E;--pink:#E98A8A;--mint:#BFE6C5;
  --r1:255px 22px 225px 22px/22px 225px 22px 255px;--r2:22px 225px 22px 255px/255px 22px 225px 22px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#E9DBBE;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink)}
button{font-family:inherit;color:inherit}
img{-webkit-user-drag:none;pointer-events:none}
.g{font-family:'Gaegu','Jua',sans-serif;font-weight:700}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center;overflow:hidden;background:var(--cream);border-radius:6px}
.screen{position:absolute;inset:0}
.bg{position:absolute;inset:0}.bg svg{position:absolute;inset:0;width:100%;height:100%}
#overlay{position:absolute;inset:0;pointer-events:none;z-index:50}
#overlay>*{pointer-events:auto}
#overlay>.fpts,#overlay>.spark,#overlay>.ghost,#overlay>.toast,#overlay>.hand,#overlay>.conf{pointer-events:none}
.veil{position:absolute;inset:0;z-index:90;pointer-events:none;opacity:0;background:var(--cream)}
.veil.in{pointer-events:all;animation:vin .35s forwards}.veil.out{animation:vout .4s forwards}
@keyframes vin{to{opacity:1}}@keyframes vout{from{opacity:1}to{opacity:0}}

/* 대화창 */

@keyframes blink{50%{opacity:.15}}
@keyframes pop{0%{transform:scale(.7) translateY(20px)}70%{transform:scale(1.05)}100%{transform:none}}

/* HUD */
.hud{position:absolute;left:0;right:0;top:0;height:100px;display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20}

.hud-score{background:var(--paper);border:4px solid var(--ink);border-radius:var(--r2);padding:2px 18px;text-align:right;box-shadow:4px 5px 0 #3A2A1E33;min-width:150px}

  display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;line-height:1.1;cursor:pointer;position:relative}

.combo{position:absolute;left:50%;top:104px;transform:translateX(-50%);z-index:21;background:#FFE08A;border:4px solid var(--ink);border-radius:var(--r1);padding:2px 22px;font-size:24px;display:none}

/* 모달·토스트·효과 */
.modal{position:absolute;inset:0;background:#2a1d1488;display:grid;place-items:center;opacity:0;transition:opacity .25s;z-index:60}
.modal.show{opacity:1}
.mcard{background:var(--paper);border:5px solid var(--ink);border-radius:var(--r2);padding:36px 48px;min-width:560px;max-width:1300px;box-shadow:6px 8px 0 var(--ink);max-height:860px;overflow:auto}

.tog{display:flex;align-items:center;justify-content:space-between;font-size:30px;padding:14px 6px;border-bottom:3px dashed #D9C7A5;cursor:pointer;gap:30px}

.tog input:checked+i{background:var(--mint)}.tog input:checked+i::after{left:42px}
.toast{position:absolute;left:50%;top:118px;transform:translate(-50%,-30px);opacity:0;background:var(--ink);color:#fff;padding:14px 34px;border-radius:var(--r1);font-size:28px;transition:.35s;z-index:80;white-space:nowrap}

@keyframes fup{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-220%)}}

@keyframes spk{to{transform:translate(var(--dx),var(--dy)) rotate(200deg) scale(.2);opacity:0}}

.hand{position:absolute;width:84px;height:104px;z-index:96;margin:-10px 0 0 -30px}
.conf{position:absolute;top:-40px;z-index:70}

/* 해설 */

/* 지도 */
.loc{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;cursor:pointer;z-index:5}
.pin{width:150px;height:150px;border-radius:48% 52% 46% 54%;border:5px solid var(--ink);background:var(--paper);display:grid;place-items:center;box-shadow:5px 7px 0 #3A2A1E55;position:relative}

/* 공통 게임 요소 */
.panel{background:var(--paper);border:5px solid var(--ink);border-radius:var(--r2);box-shadow:5px 7px 0 #3A2A1E44}

.card.bnc,.shake{animation:bnc .4s}@keyframes bnc{25%{transform:translateX(-12px)}50%{transform:translateX(10px)}75%{transform:translateX(-6px)}}

@keyframes twk{0%,100%{transform:scale(.8) rotate(0);opacity:.55}50%{transform:scale(1.15) rotate(20deg);opacity:1}}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.shake{animation:shake .4s}
.w6{position:absolute;inset:0;z-index:5}
.sidecard{position:absolute;left:860px;top:130px;width:710px;padding:30px 34px 24px;z-index:30;animation:pop .35s}
.sidecard .fq{font-size:32px;line-height:1.35;margin:8px 0 14px;word-break:keep-all}
.sidecard .opt{font-size:26px;min-height:76px}
.bcard{display:flex;align-items:center;gap:10px;background:#fff;border:4px solid var(--ink);border-radius:var(--r1);padding:4px 12px;min-height:84px;font-size:24px;cursor:grab;touch-action:none;box-shadow:3px 4px 0 #3A2A1E44;word-break:keep-all;line-height:1.2}
.bcard.sel{outline:6px solid #FFD84A}
.bcard.ghost{position:absolute;z-index:90;pointer-events:none;width:320px!important;height:auto!important}
.bcard svg,.bcard img{flex:none}
/* 미션1 낭비 탐정 */
.room-l{position:absolute;font-size:26px;background:#fff;border:4px solid var(--ink);border-radius:12px;padding:0 14px;z-index:2}
.wsp{position:absolute;width:210px;border:none;background:transparent;padding:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:26px;transition:transform .12s}
.wsp:active{transform:scale(.95)}
.wsp span{font-size:22px;background:#fff;border:3px solid var(--ink);border-radius:10px;padding:2px 10px;line-height:1.2;text-align:center;word-break:keep-all}
.wsp.pick{background:#FFE07A66;outline:5px dashed #F2B705}
.wsp.fixed{background:#BFE6C5AA}
.wsp.fixed span{background:#9FD9A8;color:#1F5A1A}
.wsp.good{opacity:.55}
.gwi-nap{position:absolute;left:1390px;top:640px;animation:bob 2.2s ease-in-out infinite}
.gwi-nap .psay{white-space:nowrap}
/* 미션2 계획 기차 */
.phs{position:absolute;left:40px;top:140px;width:1444px;display:flex;gap:12px}
.ph{height:46px;border:4px solid var(--ink);border-radius:12px;font-size:26px;text-align:center;line-height:38px}
.cars{position:absolute;left:40px;top:200px;display:flex;gap:12px}
.car{width:170px;height:190px;background:#FFFDF7;border:5px solid var(--ink);border-radius:18px 18px 8px 8px;position:relative;display:flex;align-items:center;justify-content:center;box-shadow:4px 6px 0 #3A2A1E33}
.car::after{content:'';position:absolute;bottom:-26px;left:22px;width:34px;height:34px;border-radius:50%;background:#5B5A66;border:4px solid var(--ink);box-shadow:84px 0 0 #5B5A66}
.car b{position:absolute;left:8px;top:2px;font-weight:400;font-size:28px;color:#C2411E}
.cin{font-size:60px;color:#C9B79C;display:flex;flex-direction:column;align-items:center;gap:2px}
.cin span{font-size:20px;color:var(--ink);text-align:center;line-height:1.15;word-break:keep-all;padding:0 6px}
.car.full{background:#FFF3B8;animation:pop .35s}
.loco{position:absolute;left:1488px;top:200px;transition:transform 1.6s ease-in}
.loco img{height:170px;transform:scaleX(-1)}
.loco.go{transform:translateX(400px)}
.pool{position:absolute;left:60px;top:480px;width:1480px;display:grid;grid-template-columns:repeat(5,1fr);gap:16px 18px}
.tcard6{height:150px;border:4px solid var(--ink);border-radius:var(--r1);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:24px;cursor:pointer;box-shadow:3px 4px 0 #3A2A1E44;font-family:inherit;color:var(--ink)}
.tcard6 span{line-height:1.15;word-break:keep-all;padding:0 6px}
.tcard6.gone{visibility:hidden}
/* 미션3 스토리 보드 */
.sb6{position:absolute;left:30px;top:118px;width:810px;padding:12px 16px 16px}
.sbt{font-size:28px;text-align:center;margin-bottom:8px;color:#2F7D2A}
.sbg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sbslot{height:330px;border:5px dashed #C9B79C;border-radius:18px;background:#FFFDF7;display:flex;flex-direction:column;align-items:center;padding:6px;transition:.12s}
.sbh{font-size:23px;background:#FFF3B8;border:3px solid var(--ink);border-radius:10px;padding:0 12px;align-self:flex-start}
.sbx{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;text-align:center;gap:4px}
.sbx b{font-size:64px;color:#C9B79C;font-weight:400}
.sbline{min-height:34px;font-size:21px;color:#2E5AA8;text-align:center;line-height:1.2;word-break:keep-all}
.sbslot.armed{background:#FFE07A33}
.sbslot.hover{background:#BFE6C588;transform:scale(1.03)}
.sbslot.full{border:5px solid #4E9A4A}
.sbslot.focus{outline:7px solid #FFD84A;background:#FFF8D6}
.sbtray{position:absolute;left:870px;top:130px;width:690px;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px;z-index:7}
.sbtray .tt{grid-column:1/3;font-size:26px;text-align:center}
.sbc{min-height:110px}
/* 미션4 촬영장 */
.vf{position:absolute;left:200px;top:126px;width:920px;height:530px;background:#20202C;border:8px solid var(--ink);border-radius:26px;box-shadow:8px 10px 0 #0005;overflow:hidden}
.rec{position:absolute;left:24px;top:16px;color:#fff;font-size:28px;display:flex;align-items:center;gap:8px;z-index:2}
.rec i{width:20px;height:20px;border-radius:50%;background:#FF4B3B;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.tc{position:absolute;right:26px;top:16px;color:#fff;font-size:28px;z-index:2}
.vcorner{position:absolute;width:50px;height:50px;border:5px solid #fff;opacity:.7}
.vcorner.a{left:40px;top:66px;border-right:none;border-bottom:none}.vcorner.b{right:40px;top:66px;border-left:none;border-bottom:none}
.vcorner.c{left:40px;bottom:30px;border-right:none;border-top:none}.vcorner.d{right:40px;bottom:30px;border-left:none;border-top:none}
.vfin{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.vfin.roll{animation:pop .35s}
.take{display:flex;flex-direction:column;align-items:center;gap:16px;background:#FFF8EA;border-radius:20px;padding:20px 34px;border:5px solid var(--ink);max-width:760px}
.tt2{font-size:36px;text-align:center;line-height:1.3;word-break:keep-all}
.ngstamp{position:absolute;right:120px;top:120px;font-size:110px;color:#FF4B3B;border:10px solid #FF4B3B;border-radius:20px;padding:0 24px;transform:rotate(-14deg);background:#fff8;animation:pop .3s}
.okng{position:absolute;left:200px;top:684px;width:920px;display:flex;gap:30px}
.okng .btn{flex:1;font-size:44px;min-height:110px}
.okb{background:#9FD9A8!important}
.ngb{background:#FFB4A2!important}
.strip{position:absolute;left:1160px;top:126px;width:400px;height:530px;padding:12px}
.strip .tt{font-size:28px;text-align:center}
.frames{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.fr{height:96px;background:#20202C;border:4px solid var(--ink);border-radius:10px;display:flex;align-items:center;justify-content:center;animation:pop .35s;box-shadow:inset 0 0 0 6px #fff3}
.director{position:absolute;left:1220px;top:670px;display:flex;align-items:center;gap:10px;font-size:26px;color:#fff}
.director img{height:150px}
/* 미션5 편집실 */
.pv{position:absolute;left:360px;top:118px;width:880px;height:390px;background:#111622;border:8px solid var(--ink);border-radius:22px;overflow:hidden;box-shadow:8px 10px 0 #0005}
.pvin{position:absolute;inset:0 0 60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.pvt{color:#fff;font-size:30px}
.pvsub{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:32px;color:#fff;opacity:0;transition:opacity .25s;text-shadow:0 2px 0 #000,0 0 8px #000}
.pvsub.on{opacity:1}
.theend{font-family:'Gaegu','Jua';font-weight:700;font-size:96px;color:#FFE07A}
.tl{position:absolute;left:40px;top:528px;width:1520px;height:340px;padding:10px 16px}
.tlh{font-size:28px;margin-bottom:8px}
.tlh small{font-size:22px;color:#8C6A4A;margin-left:12px}
.tlc{display:flex;gap:14px}
.clip{width:236px;height:262px;border:5px solid var(--ink);border-radius:16px;background:#FFFDF7;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;padding:8px 6px;font-family:inherit;color:var(--ink);font-size:22px;cursor:pointer;transition:all .4s;overflow:hidden;flex:none}
.clip .ci{height:100px;display:flex;align-items:center;justify-content:center}
.clip span{line-height:1.15;word-break:keep-all}
.clip.ng{background:#FFE9E3}
.clip .csub{font-size:18px;color:#2E5AA8;line-height:1.2;word-break:keep-all;text-align:center}
.clip.focus{outline:7px solid #FFD84A}
.clip.cutting{transform:scale(.6) rotate(-8deg);opacity:.3}
.clip.cut{width:0;padding:0;border-width:0;margin-left:-14px;opacity:0}
.wob6{display:inline-block;animation:wob6 .25s infinite}
@keyframes wob6{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-6px,3px) rotate(-4deg)}75%{transform:translate(6px,-3px) rotate(4deg)}}
.flip6{transform:rotate(80deg)}
.playb{position:absolute;left:600px;top:440px;font-size:36px;min-height:90px;z-index:9;animation:pop .35s}
/* 미션6 */
.post6 .ph6{display:flex;align-items:center;gap:10px;font-size:22px;color:#4E8DC2;margin-bottom:6px}
/* 엔딩 다짐 */
.pledge{position:absolute;left:230px;top:110px;width:1140px;padding:26px 34px;z-index:20;animation:pop .35s}
.pledge h3{font-weight:400;font-size:44px;margin:0;text-align:center;color:#2F7D2A}
.pledge p{font-size:26px;text-align:center;margin:6px 0 14px}
.pls{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pls .opt{font-size:26px;min-height:84px}

</style>
</head>

const K = '#3A2A1E';
const Art = (() => {
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const R = (a, b) => a + rnd() * (b - a);
  const S = (w = 5) => `stroke="${K}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
  const wrap = body => `<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"><g filter="url(#wob)">${body}</g></svg>`;

  const sun = (x, y, r = 54, face = true) => `<g ${S(5)}>${[...Array(10)].map((_, i) => { const a = i * 36 * Math.PI / 180; return `<path d="M${x + Math.cos(a) * (r + 12)} ${y + Math.sin(a) * (r + 12)} L${x + Math.cos(a) * (r + 34)} ${y + Math.sin(a) * (r + 34)}" fill="none"/>`; }).join('')}<circle cx="${x}" cy="${y}" r="${r}" fill="#FFD84A"/>${face ? `<circle cx="${x - 16}" cy="${y - 6}" r="5" fill="${K}"/><circle cx="${x + 16}" cy="${y - 6}" r="5" fill="${K}"/><path d="M${x - 12} ${y + 14} q12 10 24 0" fill="none"/>` : ''}</g>`;
  const cloud = (x, y, s = 1, c = '#fff') => `<g transform="translate(${x},${y}) scale(${s})"><path d="M-90 20 q-30 0 -24 -26 q4 -24 34 -20 q6 -34 46 -30 q30 2 38 26 q30 -14 48 10 q18 24 -8 40 z" fill="${c}" ${S(5)}/></g>`;
  const tree = (x, y, s = 1, c = '#7BC46A') => `<g transform="translate(${x},${y}) scale(${s})" ${S(5)}><path d="M-9 0 L-7 -60 L7 -60 L9 0Z" fill="#9A6A3F"/><path d="M-52 -84 q-6 -54 50 -60 q56 2 56 52 q0 44 -54 42 q-50 2 -52 -34z" fill="${c}"/><ellipse cx="-14" cy="-110" rx="12" ry="8" fill="#CDEBB8"/></g>`;
  const pine = (x, y, s = 1, c = '#4E9A4A') => `<g transform="translate(${x},${y}) scale(${s})" ${S(5)}><rect x="-6" y="-18" width="12" height="20" fill="#9A6A3F"/><path d="M0 -140 L-34 -80 L-16 -82 L-46 -30 L-22 -32 L-54 -16 L54 -16 L22 -32 L46 -30 L16 -82 L34 -80Z" fill="${c}"/></g>`;
  const house = (x, y, s = 1, roof = '#E8836E', win = '#CDE7FA') => `<g transform="translate(${x},${y}) scale(${s})" ${S(5)}><rect x="-50" y="-70" width="100" height="70" fill="#FFF3DC"/><path d="M-64 -64 L0 -120 L64 -64Z" fill="${roof}"/><rect x="12" y="-40" width="24" height="40" fill="#B27A47"/><rect x="-36" y="-50" width="26" height="22" fill="${win}"/></g>`;
  const grass = (y0, n, c = '#4E9A4A') => { let s = ''; for (let i = 0; i < n; i++) { const x = R(0, 1600), y = y0 + R(0, 120); s += `<path d="M${x} ${y} l-6 -18 M${x} ${y} l2 -22 M${x} ${y} l9 -16" ${S(4)} stroke="${c}" fill="none"/>`; } return s; };
  const hill = (d, c) => `<path d="${d}" fill="${c}" ${S(6)}/>`;
  const turbineSmall = (x, y, s = 1) => `<g transform="translate(${x},${y}) scale(${s})" ${S(5)}><path d="M-6 0 L-3 -120 L3 -120 L6 0Z" fill="#fff"/><path d="M0 -120 L-8 -190 L6 -124Z M0 -120 L64 -90 L4 -114Z M0 -120 L-58 -86 L-6 -116Z" fill="#fff"/><circle cx="0" cy="-120" r="8" fill="#C9C9C9"/></g>`;

  /* ---------- 마을 지도 ---------- */
  function map(lit = 0) {
    seed = 71;
    const night = lit < 6;
    let b = `<rect width="1600" height="900" fill="#9ED2EE"/>`;
    for (let i = 0; i < 26; i++) { const x = R(0, 1600), y = R(0, 900); b += `<path d="M${x} ${y} q12 -8 24 0 q12 -8 24 0" ${S(3)} stroke="#6FAED6" fill="none"/>`; }
    b += `<path d="M60 150 C160 60 480 40 720 70 C960 50 1180 70 1240 150 C1300 260 1280 520 1220 640 C1150 760 1000 820 800 820 C560 840 300 840 160 760 C40 680 0 300 60 150Z" fill="#F2DFB0" ${S(7)}/>`;
    b += `<path d="M90 170 C180 90 480 76 720 100 C960 80 1160 100 1210 170 C1260 270 1240 500 1186 610 C1120 720 990 780 800 784 C570 800 320 800 190 730 C80 650 40 310 90 170Z" fill="#B7E0A0" ${S(5)}/>`;
    // 산(수력)과 화산 땅(지열)
    b += `<path d="M720 330 L820 140 L900 210 L990 120 L1100 330Z" fill="#B9A796" ${S(6)}/><path d="M790 200 l30 -60 l24 26 M960 160 l30 -40 l20 30" fill="#fff" ${S(4)}/>`;
    b += `<path d="M960 520 Q1040 420 1150 470 Q1200 520 1160 570 Q1060 600 960 520Z" fill="#D4A27A" ${S(5)}/>`;

    b += `<path d="M900 820 Q980 700 1120 720 Q1200 740 1190 800" fill="#8CC8EF" ${S(5)}/>`;
    // 밭(바이오)
    b += `<g ${S(4)}><path d="M180 610 L420 600 L440 760 L160 770Z" fill="#E9C27A"/><path d="M175 650 L425 640 M170 700 L430 690 M165 740 L436 730" fill="none"/></g>`;

    // 마을 집 (불 켜짐 = 깨운 발전소 수)
    const hs = [[500, 470], [560, 560], [450, 560], [760, 610], [820, 540], [700, 690], [520, 650], [880, 650], [400, 470], [640, 420], [940, 430], [340, 560]];

function stageShell(root, no, name, steps) {
  const hud = makeHud(root, { stage: `미션 ${no} / 6`, mission: name, goal: '대화를 눌러 미션 안내를 들어요' });
  const area = h(`<div class="area" style="width:1600px"></div>`); root.appendChild(area);
  const box = dialogBox(root);
  return {
    hud, area, box,
    async intro(lines) {
      const v = h(`<div class="iveil"><div class="itag">MISSION ${no} · ${esc(name)}</div></div>`); root.appendChild(v);
      await talk(box, lines); v.classList.add('out'); setTimeout(() => v.remove(), 400);
      const g = h(`<div class="gostart">미션 시작!</div>`); root.appendChild(g); Sound.sfx('badge'); setTimeout(() => g.remove(), 1300); await sleep(900);
    },
    async step(i, cnt) { hud.goal(steps[i]); hud.mission(`${name} · ${i + 1}/${steps.length}단계`); hud.count(cnt || ''); await taskCard(steps[i], `미션 ${no} · ${i + 1}/${steps.length}단계`); },
  };
}
function clearStage(id, title, line) {
  return new Promise(res => {
    Sound.sfx('clear');
    const m = h(`<div class="wake"><div class="rays"></div><div class="wimg">${Art.badge(id, 230)}</div><h2>${esc(title)}</h2><div class="key"></div><button class="btn">배지 받기 ▶</button></div>`);
    const key = $('.key', m); key.appendChild(charEl('eong', 'happy')); key.appendChild(h(`<p><small>엉이의 핵심 한 줄</small>${esc(line)}</p>`));
    $('#overlay').appendChild(m); requestAnimationFrame(() => m.classList.add('show'));
    setTimeout(() => { m.classList.add('lit'); burst(800, 300, '#FFE07A', 26); confetti(30); }, 600);
    DBG.wake = true;
    onTap($('button', m), async () => { m.classList.remove('show'); DBG.wake = false; setTimeout(() => m.remove(), 300); completeMission(id); await giveBadge(id); res(); });
  });
}

  onTap($('.b-again', el), async () => { if (await confirmModal('처음부터 다시 할까요?', '점수, 배지, 보물이 모두 지워져요.')) { P.clear(); Demo.seen = {}; go('title'); } });
};
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
(async () => {
  Sound.init(); fitStage();
  document.addEventListener('pointerdown', () => Sound.unlock(), { once: true });
  if (document.fonts) await Promise.race([document.fonts.ready, sleep(1500)]);
  go('title');
})();

</script>
</body>
</html>
